<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sewer Unblocked Games</title>
    <style>
        /* Base page layout mimicking a dark underground sewer */
        body { 
            background-color: #0d110e; 
            color: #39ff14; /* Slime Green Text */
            font-family: 'Courier New', Courier, monospace; 
            text-align: center; 
            margin: 0;
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            text-shadow: 0 0 10px #39ff14, 0 0 20px #228b22;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #888;
            font-style: italic;
            margin-bottom: 40px;
        }

        /* Container for the game grid */
        .arcade-grid { 
            display: flex; 
            justify-content: center; 
            flex-wrap: wrap;
            gap: 25px; 
            margin-top: 30px; 
        }

        /* Game card buttons styled like rusty metal panels */
        .game-card { 
            border: 3px solid #2b3a2a; 
            padding: 25px; 
            border-radius: 8px; 
            background: #141a14; 
            text-decoration: none; 
            color: #39ff14; 
            font-weight: bold; 
            font-size: 1.2rem;
            min-width: 150px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
            transition: all 0.3s ease;
        }

        /* Hover effect making the buttons leak neon light */
        .game-card:hover { 
            border-color: #39ff14; 
            background: #1c261c; 
            box-shadow: 0 0 15px #39ff14;
            transform: translateY(-3px);
        }
    </style>
</head>
