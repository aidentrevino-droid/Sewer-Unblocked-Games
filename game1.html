<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sewer Pipeline - Playing Slope</title>
    <style>
        body { 
            margin: 0; 
            background-color: #0d110e; 
            color: #39ff14;
            font-family: 'Courier New', Courier, monospace;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
        }

        /* Top navigation pipeline control bar */
        .pipeline-bar {
            width: 100%;
            background: #141a14;
            border-bottom: 3px solid #2b3a2a;
            padding: 10px 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-sizing: border-box;
        }

        .back-btn {
            padding: 8px 16px;
            background: #0d110e;
            border: 2px solid #2b3a2a;
            color: #39ff14;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
        }

        .back-btn:hover {
            border-color: #39ff14;
            box-shadow: 0 0 10px #39ff14;
        }

        /* Pure full-viewport container running Slope */
        .game-frame { 
            flex-grow: 1;
            width: 100%;
            border: none;
            background: black;
        }
    </style>
</head>
<body>

    <div class="pipeline-bar">
        <a class="back-btn" href="index.html">⬅️ FLUSH BACK TO HOME</a>
        <span>🟢 PIPELINE SECURE // RUNNING SLOPE 3D...</span>
    </div>

    <!-- Live Slope Core Engine Link -->
    <iframe class="game-frame" src="https://sz-games.github.io/slope/"></iframe>
